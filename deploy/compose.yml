services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./frontend-dist:/srv/frontend
      - caddy_data:/data
      - caddy_config:/config

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    volumes:
      - ./data:/data
    env_file:
      - .env

volumes:
  caddy_data:
  caddy_config:
